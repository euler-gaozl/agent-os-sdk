name: SDK verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - if: runner.os == 'Windows'
        run: go test -count=1 ./...
